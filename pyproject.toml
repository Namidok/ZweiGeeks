[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # langgraph 0.2.x calls asyncio.iscoroutinefunction on every graph run
    # (deprecated in Python 3.14); upstream noise, not ours.
    "ignore::DeprecationWarning:langgraph.*",
    # Same deprecation from the pinned FastAPI/Starlette (server tests).
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.ruff]
target-version = "py311"
# tests/fixtures and bench/cases hold deliberately broken code for the agents to fix.
extend-exclude = [".venv", "audit_results", "reports", "tests/fixtures", "bench/cases"]
